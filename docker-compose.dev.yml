services:
  sensor-service:
    build:
      context: ./sensor-service
      dockerfile: ../docker/sensor.Dockerfile
    container_name: baiscan_sensor_dev
    privileged: true
    volumes:
      - /dev:/dev
      - ./sensor-service:/app
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    restart: always

  db:
    image: mysql:8.0
    container_name: baiscan_db_dev
    # Optimized for 2GB Pi
    command: >
      --default-authentication-plugin=mysql_native_password 
      --performance-schema=OFF
      --innodb_buffer_pool_size=128M
      --innodb_log_buffer_size=16M
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-baiscan_db}
      - MYSQL_USER=${MYSQL_USER:-baiscan_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
    volumes:
      - db_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    restart: always

  backend-service:
    build:
      context: ./backend-service
      dockerfile: ../docker/backend.Dockerfile
    image: node:20-alpine
    container_name: baiscan_backend_dev
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./backend-service:/app
    env_file:
      - ./backend-service/.env
    environment:
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=768
      - DB_HOST=db
    command: sh -c "npm install && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: ../docker/frontend.Dockerfile
    image: node:20-alpine
    container_name: baiscan_frontend_dev
    working_dir: /app
    ports:
      - "80:80"
    volumes:
      - ./frontend-service:/app
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - ALLOWED_HOST=${ALLOWED_HOST:-localhost}
      - NEXT_PUBLIC_BACKEND_URL=http://${ALLOWED_HOST:-localhost}:3001
    command: sh -c "npm install && npm run dev -- -p 80"
    depends_on:
      - backend-service
    deploy:
      resources:
        limits:
          memory: 1200M
    restart: always

volumes:
  db_data_dev:
