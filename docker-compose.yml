services:
  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: baiscan-frontend
    ports:
      - "80:3000" # Expose frontend on standard HTTP port 80
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next

    environment:
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    restart: always

  # Sensor-service (Python)
  sensor-service:
    build:
      context: ./sensor-service
      dockerfile: Dockerfile
    container_name: baiscan-sensor-service
    privileged: true
    devices:
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/gpiomem:/dev/gpiomem"
    volumes:
      - ./sensor-service:/app
    env_file:
      - ./sensor-service/.env
    restart: always

volumes:
  next_cache: {}