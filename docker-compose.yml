services:
  sensor-service:
    build:
      context: ./sensor-service
    privileged: true
    volumes:
      - /dev:/dev
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: always

  db:
    image: mysql:8.0
    # performance-schema=OFF is crucial for saving RAM on a 2GB Raspberry Pi
    command: --default-authentication-plugin=mysql_native_password --performance-schema=OFF
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-baiscan_db}
      - MYSQL_USER=${MYSQL_USER:-baiscan_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  backend-service:
    build:
      context: ./backend-service
    ports:
      - "3001:3001"
    volumes:
      - ./backend-service:/app
      - /app/node_modules
    environment:
      - PORT=3001
      - SENSOR_SERVICE_URL=http://sensor-service:8000
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-baiscan_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
      - DB_NAME=${MYSQL_DATABASE:-baiscan_db}
    command: npm run dev
    depends_on:
      - sensor-service
      - db
    restart: always

  frontend-service:
    build:
      context: ./frontend-service
    ports:
      - "80:80"
    volumes:
      - ./frontend-service:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - ALLOWED_HOST=${ALLOWED_HOST:-localhost}
      - NEXT_PUBLIC_BACKEND_URL=http://${ALLOWED_HOST:-localhost}:3001
    depends_on:
      - backend-service
    restart: always

volumes:
  db_data: