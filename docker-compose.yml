services:
  sensor-service:
    build:
      context: ./sensor-service
    privileged: true
    volumes:
      - /dev:/dev
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: always

  backend-service:
    build:
      context: ./backend-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SENSOR_SERVICE_URL=http://sensor-service:8000
    depends_on:
      - sensor-service
    restart: always

  frontend-service:
    build:
      context: ./frontend-service
    ports:
      - "80:80"
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend-service
    restart: always