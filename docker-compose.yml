services:
  sensor-service:
    build:
      context: ./sensor-service
      dockerfile: ../docker/sensor.Dockerfile
    container_name: baiscan_sensor
    privileged: true
    volumes:
      - /dev:/dev
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: always

  db:
    image: mysql:8.0
    container_name: baiscan_db
    # Performance schema off and reduced buffer pool for 2GB RAM Pi
    command: >
      --default-authentication-plugin=mysql_native_password 
      --performance-schema=OFF
      --innodb_buffer_pool_size=128M
      --innodb_log_buffer_size=16M
      --max_connections=50
      --key_buffer_size=8M
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-baiscan_db}
      - MYSQL_USER=${MYSQL_USER:-baiscan_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

  backend-service:
    build:
      context: ./backend-service
      dockerfile: ../docker/backend.Dockerfile
    container_name: baiscan_backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend-service/.env
    environment:
      - PORT=3001
      - SENSOR_SERVICE_URL=http://sensor-service:8000
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-baiscan_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
      - DB_NAME=${MYSQL_DATABASE:-baiscan_db}
    depends_on:
      sensor-service:
        condition: service_started
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  frontend-service:
    build:
      context: ./frontend-service
      dockerfile: ../docker/frontend.Dockerfile
    container_name: baiscan_frontend
    ports:
      - "80:80"
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - ALLOWED_HOST=${ALLOWED_HOST:-localhost}
      - BACKEND_URL=http://backend-service:3001
      - NEXT_PUBLIC_BACKEND_URL=/api
      - NEXT_PUBLIC_SOCKET_URL=http://${ALLOWED_HOST:-localhost}:3001
    depends_on:
      - backend-service
    deploy:
      resources:
        limits:
          memory: 512M
    restart: always

volumes:
  db_data: