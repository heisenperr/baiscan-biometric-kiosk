services:
  sensor-service:
    build:
      context: ./sensor-service
    container_name: baiscan_sensor
    privileged: true
    volumes:
      - /dev:/dev
    devices:
      - /dev/i2c-1:/dev/i2c-1
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    restart: always

  db:
    image: mysql:8.0
    container_name: baiscan_db
    command: --default-authentication-plugin=mysql_native_password --performance-schema=OFF
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-baiscan_db}
      - MYSQL_USER=${MYSQL_USER:-baiscan_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  backend-service:
    build:
      context: ./backend-service
    container_name: baiscan_backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend-service:/app
    environment:
      - PORT=3001
      - SENSOR_SERVICE_URL=http://sensor-service:8000
      - DB_HOST=db
      - DB_USER=${MYSQL_USER:-baiscan_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-baiscan_password}
      - DB_NAME=${MYSQL_DATABASE:-baiscan_db}
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev"
    depends_on:
      - sensor-service
      - db
    restart: always

  frontend-service:
    build:
      context: ./frontend-service
    container_name: baiscan_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend-service:/app
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      - ALLOWED_HOST=${ALLOWED_HOST:-localhost}
      - NEXT_PUBLIC_BACKEND_URL=http://${ALLOWED_HOST:-localhost}:3001
    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- -p 80"
    depends_on:
      - backend-service
    restart: always

volumes:
  db_data: